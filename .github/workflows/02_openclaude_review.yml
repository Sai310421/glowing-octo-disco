name: OpenClaude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  local-review:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenClaude
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/openclaude_pr_review.py
